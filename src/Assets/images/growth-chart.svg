<svg width="220" height="160" viewBox="0 0 220 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chartBg" x1="0" y1="0" x2="220" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e2a4a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1f3d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#22B573"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22B573" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22B573" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20" y="-20" width="260" height="200" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="0" y="0" width="220" height="160" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00F2FE" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Backdrop -->
  <rect x="10" y="10" width="200" height="140" rx="20" fill="url(#chartBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Grid Lines -->
  <line x1="25" y1="45" x2="195" y2="45" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4" />
  <line x1="25" y1="80" x2="195" y2="80" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4" />
  <line x1="25" y1="115" x2="195" y2="115" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4" />

  <!-- Area Under Chart -->
  <path d="M 30 115 Q 65 95 90 100 T 140 60 T 190 30 L 190 125 L 30 125 Z" fill="url(#fillGrad)" />

  <!-- Trend Line -->
  <path d="M 30 115 Q 65 95 90 100 T 140 60 T 190 30" fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- 3D Arrow Head at top right -->
  <path d="M 175 28 L 194 28 L 194 47 M 194 28 L 165 57" stroke="#00E676" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Nodes -->
  <circle cx="30" cy="115" r="4" fill="#00F2FE" />
  <circle cx="90" cy="100" r="4" fill="#00F2FE" />
  <circle cx="140" cy="60" r="5" fill="#22B573" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="190" cy="30" r="6" fill="#00E676" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" />
</svg>
