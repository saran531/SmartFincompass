<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGrad1" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="60%" stop-color="#22B573"/>
      <stop offset="100%" stop-color="#0E6941"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="30" y1="20" x2="110" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="leafShadow" x="0" y="0" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#0E6941" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#leafShadow)">
    <!-- Main Big Leaf -->
    <path d="M 25 95 C 10 50 45 15 95 20 C 90 70 55 105 25 95 Z" fill="url(#leafGrad1)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <path d="M 25 95 Q 55 60 95 20" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Small Secondary Leaf -->
    <path d="M 45 100 C 35 75 55 50 85 55 C 80 85 60 105 45 100 Z" fill="url(#leafGrad2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <path d="M 45 100 Q 62 80 85 55" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
