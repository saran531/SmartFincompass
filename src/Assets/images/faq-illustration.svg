<svg width="150" height="130" viewBox="0 0 150 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bubbleGrad1" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#14315E"/>
    </linearGradient>
    <linearGradient id="bubbleGrad2" x1="50" y1="20" x2="150" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#0E6941"/>
    </linearGradient>
    <filter id="bubbleShadow" x="0" y="0" width="150" height="130" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#00F2FE" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#bubbleShadow)">
    <!-- Back Cyan Bubble -->
    <path d="M 20 40 C 20 20 40 15 65 15 C 90 15 110 20 110 40 C 110 60 90 70 70 70 L 45 85 L 50 70 C 30 70 20 60 20 40 Z" fill="url(#bubbleGrad1)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <text x="65" y="50" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" text-anchor="middle">?</text>

    <!-- Front Green Small Bubble -->
    <path d="M 75 75 C 75 60 90 55 110 55 C 130 55 140 60 140 75 C 140 90 130 98 115 98 L 100 110 L 105 98 C 85 98 75 90 75 75 Z" fill="url(#bubbleGrad2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <text x="108" y="84" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">?</text>
  </g>
</svg>
