<svg width="180" height="150" viewBox="0 0 180 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="envGrad" x1="10" y1="30" x2="150" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14315E"/>
      <stop offset="100%" stop-color="#0A1F3D"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#22B573"/>
    </linearGradient>
    <filter id="contactShadow" x="0" y="0" width="180" height="150" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#00F2FE" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#contactShadow)">
    <!-- Base Envelope -->
    <rect x="25" y="45" width="130" height="85" rx="16" fill="url(#envGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <path d="M 25 55 L 90 95 L 155 55" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Paper Airplane Flying -->
    <path d="M 120 15 L 165 45 L 130 50 L 120 70 L 115 40 Z" fill="url(#paperGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 120 15 L 130 50 L 165 45" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Blue Chat Bubble Floating -->
    <circle cx="35" cy="35" r="18" fill="#00F2FE" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M28 35 H42 M28 31 H38 M28 39 H35" stroke="#0A1F3D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Small Leaf Accent -->
    <path d="M 140 105 C 130 90 150 75 170 80 C 165 100 150 115 140 105 Z" fill="#22B573" opacity="0.8"/>
  </g>
</svg>
